[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biome-ez"
version = "2.1.0"
description = "EZ-Tools-style CLI forensic parsers for Apple Biome streams (App.MenuItem, App Usage, Media Consumption) on macOS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mahmoudswelam" }]
keywords = ["dfir", "forensics", "macos", "biome", "segb", "protobuf", "timeline"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # pure standard library, by design

[project.scripts]
biome = "biome:main"

[tool.setuptools]
py-modules = ["biome"]
packages = ["biome_core"]
